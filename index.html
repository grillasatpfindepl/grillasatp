<style>
:root{
  --bg:#F4F6F9;--card:#FFFFFF;--ink:#16202B;--ink2:#3A4552;--muted:#5B6470;--line:#E3E7ED;--line2:#EDF0F4;--input:#C9D0DA;
  --accent:#1F5FAE;--accent-d:#174A88;--accent-l:#DCE8F7;--accent-xl:#EAF1FA;--dark:#16202B;--dark2:#26354A;
  --warn-bg:#FFF1CC;--warn:#7A4D00;--ok-bg:#DDF3E4;--ok:#1E6B3A;--bad-bg:#FBE3E1;--bad:#A3261B;
  --gray-bg:#E9ECF0;--gray:#4F5864;--aca-bg:#EEE7FA;--aca:#5B3A9A;--soft:#EEF1F5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
a{color:var(--accent)}
a:hover{color:var(--accent-d)}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:24px;margin:0;font-weight:700}
h2{font-size:16px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--card);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.center{text-align:center}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.empty{background:var(--card);border-radius:14px;padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Botones */
.btn{height:44px;padding:0 16px;border:0;border-radius:10px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-d)}
.btn-primary:disabled{background:#E3E7ED;color:var(--gray)}
.btn-soft{background:var(--soft);color:var(--ink)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-link{background:none;border:0;color:var(--accent);font-weight:700;min-height:44px;padding:0 4px;font-size:14px}
.btn-block{width:100%;height:52px;font-size:16px;border-radius:12px}
.btn-sm{height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:active:not(:disabled),.day:active:not(:disabled){opacity:.75}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;white-space:nowrap}
.p-pend{background:var(--warn-bg);color:var(--warn)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-gray{background:var(--gray-bg);color:var(--gray)}
.p-vac{background:#E3EDF9;color:var(--accent-d)}
.p-aca{background:var(--aca-bg);color:var(--aca)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:700}
.input{height:48px;border:1px solid var(--input);border-radius:12px;padding:0 14px;background:#fff;width:100%;color:var(--ink)}
.input-sm{height:40px;border-radius:10px;padding:0 10px}
select.input{padding:0 10px}
.code-input{height:62px;font-size:28px;font-weight:700;letter-spacing:10px;text-align:center}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);width:max-content;z-index:100;box-shadow:0 6px 24px rgba(22,32,43,.25)}
.toast.err{background:var(--bad)}

/* Login */
.login{min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg)}
.login-top{background:var(--dark);color:#fff;padding:44px 24px 28px;display:flex;flex-direction:column;gap:14px}
.logo{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps span{height:4px;border-radius:2px;background:#3A4A5E}
.steps span.on{background:#5B9BE6}
.login-body{padding:28px 24px 40px}
@media(min-width:520px){.login{margin-top:40px;border-radius:18px;overflow:hidden;min-height:auto;box-shadow:0 10px 40px rgba(22,32,43,.12)}}

/* Trabajador */
.w-shell{max-width:560px;margin:0 auto;min-height:100vh}
.w-main{padding:20px 16px calc(170px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.w-nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 2px calc(8px + env(safe-area-inset-bottom));z-index:20}
.w-nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;font-size:11px;white-space:nowrap;padding:0;font-weight:600;color:var(--muted)}
.w-nav button[aria-current=page]{color:var(--accent);font-weight:700}
.w-bar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:15}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--accent-l);color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.saldo{background:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.saldo .big{font-size:22px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#E3E7ED;border-radius:12px;padding:4px}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--gray);font-size:14px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,32,43,.12)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{height:38px;padding:0 14px;border:0;border-radius:19px;background:#fff;box-shadow:inset 0 0 0 1px #DDE2E9;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.tab[aria-current=true]{background:var(--dark);color:#fff;box-shadow:none}
.tab:disabled{background:var(--gray-bg);color:var(--gray);box-shadow:none}

/* Calendario */
.cal{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px}
.cal-head,.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.day{height:54px;border:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;background:#fff;box-shadow:inset 0 0 0 1px #DDE2E9;min-width:0}
.day .n{font-size:16px;font-weight:600;color:var(--ink)}
.day .s{font-size:10px;font-weight:700;line-height:12px;min-height:12px;color:var(--accent);white-space:nowrap;overflow:hidden;max-width:100%}
.day.other .n{color:var(--muted);font-weight:500}
.day.part{background:var(--warn-bg);box-shadow:inset 0 0 0 1px #E8C66B}
.day.part .s{color:var(--warn)}
.day.dis{background:#F1F3F6;box-shadow:none}
.day.dis .n{color:var(--muted);font-weight:500}
.day.full{background:#E3E6EB;box-shadow:none}
.day.full .n,.day.full .s{color:var(--gray)}
.day.mine-p{background:#FFF7E0;box-shadow:inset 0 0 0 2px #D9A21B}
.day.mine-p .s{color:var(--warn)}
.day.mine-a{background:var(--ok-bg);box-shadow:inset 0 0 0 2px #3E9B5F}
.day.mine-a .s{color:var(--ok)}
.day.sel{background:var(--accent);box-shadow:none}
.day.sel .n,.day.sel .s{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding-left:2px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.aday{height:auto;min-height:74px;align-items:stretch;justify-content:flex-start;padding:6px;gap:2px;text-align:left}
.aday .n{font-size:14px}
.aday .names{font-size:11px;line-height:13px;color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.aday.sel .names{color:#fff}

/* Listas */
.item{background:#fff;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.divide>*+*{border-top:1px solid var(--line2)}
details.faq{border-top:1px solid var(--line2)}
details.faq:first-child{border-top:0}
details.faq summary{list-style:none;cursor:pointer;min-height:52px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:15px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary svg{flex-shrink:0;color:var(--muted);transition:transform .15s}
details.faq[open] summary svg{transform:rotate(180deg)}
details.faq p{padding:0 16px 14px;font-size:14px;line-height:1.5;color:var(--ink2)}
.contact{display:flex;align-items:center;gap:12px;padding:10px 0}
.icon-btn{width:44px;height:44px;border-radius:22px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
.aviso{display:flex;gap:10px;align-items:flex-start;background:#FFF7E0;box-shadow:inset 0 0 0 1px #E8C66B;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;color:#3D2A00}
.aviso svg{flex-shrink:0;margin-top:1px;color:var(--warn)}
.textarea{min-height:110px;border:1px solid var(--input);border-radius:12px;padding:12px 14px;background:#fff;width:100%;resize:vertical;line-height:1.45;color:var(--ink)}
.q-box{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.q-ans{background:var(--ok-bg);color:#14432A}
.link-card{display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:var(--ink);min-height:56px}
.link-card:hover{color:var(--ink)}
.link-card:hover .link-t{color:var(--accent)}
.link-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.link-t{font-weight:700;font-size:15px}
.grilla-img{display:block;border-radius:10px;overflow:hidden;background:var(--soft)}
.grilla-img img{display:block;width:100%;height:auto}

/* Admin */
.a-shell{display:flex;min-height:100vh}
.a-side{flex:0 0 240px;background:var(--dark);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.a-brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.a-side nav{display:flex;flex-direction:column;gap:2px}
.a-side nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:#D3DAE3;font-weight:600;font-size:14px;text-align:left}
.a-side nav button:hover{background:#1E2B3B}
.a-side nav button[aria-current=page]{background:var(--dark2);color:#fff;font-weight:700}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#F2B53B;color:var(--dark);font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.a-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:0 8px}
.a-user .avatar{width:36px;height:36px;font-size:13px}
.a-out{background:none;border:0;color:#B6C0CC;font-weight:600;font-size:13px;min-height:36px;padding:0 8px;text-align:left}
.a-main{flex:1;min-width:0;padding:32px clamp(16px,3vw,40px) 60px;display:flex;flex-direction:column;gap:20px;max-width:1240px}
.a-cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.a-cols>.grow{flex:999 1 520px;min-width:0}
.a-cols>.side{flex:1 1 280px;min-width:0}
.tbl-wrap{background:#fff;border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);padding:12px;letter-spacing:.03em;font-weight:700;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line2);vertical-align:middle}
.switch{position:relative;width:48px;height:28px;border:0;border-radius:14px;padding:0;background:#C3CAD4;flex-shrink:0}
.switch[aria-pressed=true]{background:var(--accent)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-pressed=true]::after{left:23px}
.vote{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:13px;font-size:12px;font-weight:700}
.radio{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#F7F8FA;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.radio:has(input:checked){background:var(--accent-xl);box-shadow:inset 0 0 0 2px var(--accent)}
.radio input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper input{width:76px;text-align:center;font-weight:700}
@media(max-width:860px){
  .a-shell{flex-direction:column}
  .a-side{position:static;height:auto;flex:none;padding:14px 12px 10px;gap:10px;overflow:visible}
  .a-brand{flex-direction:row;align-items:center;justify-content:space-between;padding:0 4px}
  .a-side nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .a-side nav button{white-space:nowrap;flex:none}
  .a-user{display:none}
  .a-main{padding-top:20px}
}
@media(min-width:861px){.a-brand .a-out{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

let toastTimer;
function toast(msg, err) {
  const root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast' + (err ? ' err' : '') + '" role="' + (err ? 'alert' : 'status') + '">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, err ? 6000 : 3500);
}
const errMsg = e => (e && (e.message || e.error_description)) || 'Ocurrió un error. Probá de nuevo.';
function setBusy(btn, busy, txt) {
  if (!btn) return;
  if (busy) { btn.dataset.txt = btn.textContent; btn.disabled = true; btn.textContent = txt || 'Un momento…'; }
  else { btn.disabled = false; if (btn.dataset.txt) btn.textContent = btn.dataset.txt; }
}

/* ================= Meses habilitados ================= */
function mesIdx(y, m) { const t = parse(hoy()); return (y - t.getUTCFullYear()) * 12 + (m - t.getUTCMonth()); }
function mesAbierto(y, m) {
  const ex = S.excepciones.find(e => e.anio === y && e.mes === m + 1);
  if (ex) return ex.abierto;
  const i = mesIdx(y, m);
  return i >= 0 && i < (S.config ? S.config.meses_habilitados : 3);
}
const abiertoISO = s => { const d = parse(s); return mesAbierto(d.getUTCFullYear(), d.getUTCMonth()); };
function cuandoAbre(y, m) {
  const k = mesIdx(y, m) - S.config.meses_habilitados + 1;
  if (k <= 0) return null;
  const t = parse(hoy());
  const d = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + k, 1));
  return '1 de ' + MESES[d.getUTCMonth()];
}
function gridRange(y, m) {
  const first = iso(new Date(Date.UTC(y, m, 1)));
  const last = iso(new Date(Date.UTC(y, m + 1, 0)));
  const start = addDays(first, -((dow(first) - 6 + 7) % 7));
  const end = addDays(last, (5 - dow(last) + 7) % 7);
  return { start, end, weeks: Math.round((parse(end) - parse(start)) / 864e5 + 1) / 7 };
}
function mesActual() { const t = parse(hoy()); return { y: t.getUTCFullYear(), m: t.getUTCMonth() }; }

let booting = false;
async function boot() {
  if (booting) return;
  booting = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { S.me = null; return renderLogin(); }
    const leer = () => sb.from('personal').select('*').eq('user_id', session.user.id).maybeSingle();
    let { data: me, error } = await leer();
    if (!error && !me) { await sb.rpc('solicitar_acceso'); ({ data: me, error } = await leer()); }
    if (error) { $app().innerHTML = '<div class="loading">No se pudo conectar. Revisá tu conexión y recargá la página.</div>'; return; }
    if (!me) return renderBloqueado();
    S.me = me;
    const faltanDatos = !me.nombre || !me.apellido || !me.telefono;
    if (me.pendiente) return faltanDatos ? renderPerfil() : renderEspera();
    if (!me.activo) return renderBloqueado();
    if (faltanDatos) return renderPerfil();
    await cargarBase();
    go(esAdmin() ? 'solicitudes' : 'calendario');
  } finally { booting = false; }
}

/* Botón oficial de Google: el ingreso ocurre en esta página, por eso Google muestra su dirección */
async function sha256Hex(texto) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
let gNonce = null;
async function iniciarBotonGoogle(intento = 0) {
  const cont = document.getElementById('gbtn');
  if (!cont) return;
  if (!(window.google && google.accounts && google.accounts.id)) {
    if (intento < 40) return setTimeout(() => iniciarBotonGoogle(intento + 1), 250);
    cont.innerHTML = '<button class="btn btn-primary btn-block" data-act="loginGoogle">Entrar con Google</button>';
    return;
  }
  gNonce = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))));
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: alVolverDeGoogle,
    nonce: await sha256Hex(gNonce),
    ux_mode: 'popup',
    auto_select: false,
    use_fedcm_for_prompt: true,
    itp_support: true
  });
  cont.innerHTML = '';
  google.accounts.id.renderButton(cont, {
    type: 'standard', theme: 'filled_blue', size: 'large', shape: 'pill',
    text: 'signin_with', logo_alignment: 'left', locale: 'es',
    width: Math.min(400, Math.max(220, cont.clientWidth || 320))
  });
}
async function alVolverDeGoogle(resp) {
  const cont = document.getElementById('gbtn');
  if (cont) cont.innerHTML = '<span class="small muted">Entrando…</span>';
  const { error } = await sb.auth.signInWithIdToken({ provider: 'google', token: resp.credential, nonce: gNonce });
  if (error) { toast('No se pudo entrar: ' + errMsg(error), true); return renderLogin(); }
  boot();
}

    let rows = '';

      </div>
      <div class="w-bar">${bar}</div>`;

};
function mesesDisponibles() {
  const t = mesActual(), out = [];
  let lock = false;
  for (let i = 0; i < 18; i++) {
    const y = t.y + Math.floor((t.m + i) / 12), m = (t.m + i) % 12;
    if (mesAbierto(y, m)) out.push({ y, m, ab: true });
    else if (!lock && out.length) { out.push({ y, m, ab: false }); lock = true; }
  }
  return out;
}

  if (/youtube\.com|youtu\.be/.test(host)) return est('#FBE3E1', '#A3261B', ICON.play);
  if (/facebook\.com|fb\.com|x\.com|twitter\.com|tiktok\.com|threads\.net|linkedin\.com|spotify\.com/.test(host)) return est('#E3EDF9', '#174A88', ICON.globe);
  if (cat === 'redes') return est('#E3EDF9', '#174A88', ICON.globe);
  return est('#EEF1F5', '#3A4552', ICON.globe);
}
const hostDe = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (_) { return url; } };
const urlSegura = u => /^https?:\/\/\S+$/i.test(String(u || '').trim());

  const [s, p, c] = await Promise.all([
    sb.from('solicitudes').select('id', { count: 'exact', head: true }).eq('estado', 'pendiente'),
    sb.from('personal').select('id', { count: 'exact', head: true }).eq('pendiente', true),

}

function necesarios(n) {
  const modo = S.config.aprobacion;
  return modo === 'mayoria' ? Math.floor(n / 2) + 1 : modo === 'uno' ? (n ? 1 : 0) : n;
}
VIEWS.solicitudes = {

    let q = sb.from('solicitudes').select(sel);

    const [s, ad] = await Promise.all([q, sb.from('personal').select('id,nombre,apellido,email').eq('rol', 'admin').eq('activo', true).order('nombre')]);

    S.a.sol = s.data || []; S.a.admins = ad.data || [];

    const admins = S.a.admins, nec = necesarios(admins.length), puedoVotar = S.me.rol === 'admin';
    const modoTxt = { todos: 'todos los administradores', mayoria: 'la mayoría de los administradores', uno: 'un administrador' }[S.config.aprobacion] || 'todos los administradores';
    const cards = S.a.sol.map(s => {
      const votos = Object.fromEntries((s.aprobaciones || []).map(a => [a.admin_id, a.voto]));
      const ok = admins.filter(a => votos[a.id] === 'aprobado').length;
      const faltan = admins.filter(a => !votos[a.id]).map(a => a.id === S.me.id ? 'vos' : (a.nombre || a.email));
      const mio = votos[S.me.id];
      const [et, ec] = ESTADO[s.estado];
      let resumen;
      if (s.estado === 'pendiente') resumen = ok + ' de ' + nec + ' aprobaciones' + (faltan.length ? ' · faltan ' + faltan.join(', ') : '');

      else if (s.estado === 'aprobado') resumen = 'Aprobado' + (s.resuelto_at ? ' el ' + fechaTs(s.resuelto_at) : '') + '.';

      }).join('');
      let acciones = '';
      if (s.estado === 'pendiente' && puedoVotar) {
        acciones = `<button class="btn btn-danger" data-act="votar" data-id="${s.id}" data-v="rechazado">Rechazar</button>
                    <button class="btn btn-primary" data-act="votar" data-id="${s.id}" data-v="aprobado" ${mio === 'aprobado' ? 'disabled' : ''}>${mio === 'aprobado' ? 'Ya aprobaste' : 'Aprobar'}</button>`;
      }
      if (s.estado === 'pendiente' || s.estado === 'aprobado') acciones += `<button class="btn-link" data-act="anular" data-id="${s.id}" style="color:var(--bad)">Anular</button>`;
      return `<article class="item" style="gap:14px">
        <div class="between" style="align-items:flex-start">
          <div class="stack-s" style="gap:4px;min-width:0">
            <div class="row" style="gap:8px"><span class="b" style="font-size:16px">${esc(nombreDe(s.personal))}</span><span class="pill ${s.tipo === 'vacaciones' ? 'p-vac' : 'p-aca'}">${s.tipo === 'vacaciones' ? 'Vacaciones' : 'ACA'}</span></div>
            <span class="b" style="color:var(--ink2)">${esc(rango(s.fecha_inicio, s.fecha_fin, s.tipo))}</span>

        </div>
        <div class="between" style="border-top:1px solid var(--line2);padding-top:12px">
          <div class="stack-s" style="gap:8px"><div class="row" style="gap:6px">${chips}</div><span class="small muted">${esc(resumen)}</span></div>
          ${acciones ? `<div class="row" style="gap:8px">${acciones}</div>` : ''}
        </div>

      <div class="stack-s"><h1>Solicitudes</h1>

      ${!admins.length ? '<div class="card small" style="background:var(--warn-bg);color:var(--warn)"><b>Todavía no hay administradores que aprueben.</b> Cargalos desde Personal con el rol "Administrador"; mientras tanto, los pedidos quedan pendientes.</div>' : ''}
      <div class="seg" role="group" aria-label="Filtro" style="max-width:360px">
        <button data-act="solTab" data-v="pend" aria-pressed="${S.a.tab === 'pend'}">Pendientes</button>
        <button data-act="solTab" data-v="res" aria-pressed="${S.a.tab === 'res'}">Resueltas</button>
      </div>
      ${cards || `<div class="empty">${S.a.tab === 'pend' ? 'No hay pedidos pendientes.' : 'Todavía no hay pedidos resueltos.'}</div>`}`;
  }
};

VIEWS.calendarioGeneral = {
  async load() {
    if (!S.a.cal) S.a.cal = mesActual();
    const r = gridRange(S.a.cal.y, S.a.cal.m);
    const { data, error } = await sb.from('solicitudes')
      .select('id,tipo,fecha_inicio,fecha_fin,estado,personal(nombre,apellido,email)')
      .in('estado', ['pendiente', 'aprobado']).lte('fecha_inicio', r.end).gte('fecha_fin', r.start);
    if (error) throw error;
    S.a.calData = { r, sol: data || [] };
  },
  draw() {
    const { r, sol } = S.a.calData, { y, m } = S.a.cal, cupo = S.config.cupo_diario;
    const de = d => sol.filter(s => d >= s.fecha_inicio && d <= s.fecha_fin);
    let rows = '';
    for (let w = 0; w < r.weeks; w++) {
      rows += '<div class="cal-row">';
      for (let i = 0; i < 7; i++) {
        const d = addDays(r.start, w * 7 + i), lista = de(d), n = lista.length;
        let cls = 'day aday';
        if (n >= cupo) cls += ' full'; else if (n > 0) cls += ' part';
        if (parse(d).getUTCMonth() !== m) cls += ' other';
        if (S.a.dia === d) cls = 'day aday sel';
        const nombres = lista.slice(0, 2).map(s => (s.personal && (s.personal.nombre || s.personal.email)) || '?');
        rows += `<button class="${cls}" data-act="dia" data-v="${d}" aria-label="${esc(cap(fechaLarga(d)) + ': ' + n + ' ausentes')}">
          <span class="between" style="flex-wrap:nowrap"><span class="n">${parse(d).getUTCDate()}</span>${n ? `<span class="s" style="min-height:0">${n}/${cupo}</span>` : (S.feriados[d] ? '<span class="s" style="min-height:0">Fer.</span>' : '')}</span>
          ${nombres.map(x => `<span class="names">${esc(x)}</span>`).join('')}${n > 2 ? `<span class="names">+${n - 2}</span>` : ''}
        </button>`;
      }
      rows += '</div>';
    }
    let detalle = '';
    if (S.a.dia) {
      const l = de(S.a.dia);
      detalle = `<div class="card stack">
        <div class="between"><h2>${esc(cap(fechaLarga(S.a.dia)))}${S.feriados[S.a.dia] ? ' · ' + esc(S.feriados[S.a.dia]) : ''}</h2><span class="small muted">${l.length} de ${cupo} lugares ocupados</span></div>
        ${l.length ? l.map(s => `<div class="between" style="border-top:1px solid var(--line2);padding-top:10px"><div class="stack-s" style="gap:2px"><span class="b">${esc(nombreDe(s.personal))}</span><span class="small muted">${s.tipo === 'vacaciones' ? 'Vacaciones · ' : 'ACA · '}${esc(rango(s.fecha_inicio, s.fecha_fin, s.tipo))}</span></div><span class="pill ${ESTADO[s.estado][1]}">${s.estado === 'pendiente' ? 'Pendiente' : 'Aprobado'}</span></div>`).join('') : '<p class="small muted">Nadie falta este día.</p>'}
      </div>`;
    }
    return `
      <div class="stack-s"><h1>Calendario general</h1><p class="muted small">Quién falta cada día, con pedidos aprobados y pendientes. Tocá un día para ver el detalle.</p></div>
      <div class="row">
        <button class="btn btn-soft" data-act="calMes" data-v="-1" aria-label="Mes anterior">‹</button>
        <h2 style="min-width:170px;text-align:center">${cap(MESES[m])} ${y}</h2>
        <button class="btn btn-soft" data-act="calMes" data-v="1" aria-label="Mes siguiente">›</button>
      </div>
      <div class="cal" style="max-width:980px"><div class="cal-head">${CAB.map(c => `<span>${c}</span>`).join('')}</div>${rows}</div>
      ${detalle}`;
  }
};

VIEWS.meses = {
  async load() {
    const { data, error } = await sb.from('meses_excepciones').select('*');
    if (error) throw error;
    S.excepciones = data || [];
  },
  draw() {
    const t = mesActual();
    let filas = '';
    for (let i = 0; i < 12; i++) {
      const y = t.y + Math.floor((t.m + i) / 12), m = (t.m + i) % 12;
      const ex = S.excepciones.find(e => e.anio === y && e.mes === m + 1);
      const ab = mesAbierto(y, m);
      let txt;
      if (ex) txt = ex.abierto ? 'Abierto a mano' : 'Cerrado a mano';
      else if (ab) txt = i === 0 ? 'Abierto (mes actual)' : 'Abierto automáticamente';
      else txt = 'Se abre solo el ' + cuandoAbre(y, m);
      filas += `<div class="between" style="min-height:56px;border-top:${i ? '1px solid var(--line2)' : '0'};padding:6px 0;flex-wrap:nowrap">
        <div class="stack-s" style="gap:0"><span class="b">${cap(MESES[m])} ${y}</span><span class="small muted">${txt}</span></div>
        <div class="row" style="gap:8px;flex-wrap:nowrap">
          ${ex ? `<button class="btn-link" data-act="mesAuto" data-y="${y}" data-m="${m}">Volver a automático</button>` : ''}
          <button class="switch" data-act="mesToggle" data-y="${y}" data-m="${m}" aria-pressed="${ab}" aria-label="${cap(MESES[m])} ${y}, ${ab ? 'abierto' : 'cerrado'}"></button>
        </div>
      </div>`;
    }
    return `
      <div class="stack-s"><h1>Meses habilitados</h1>
      <p class="muted small" style="max-width:640px">Por defecto se abren solos el mes actual y los ${S.config.meses_habilitados - 1} siguientes (se cambia en Configuración). Podés abrir o cerrar un mes a mano; cerrar un mes no borra los pedidos que ya están hechos.</p></div>

  }
};

/* ================= Acciones (clicks) ================= */
const ACT = {
  async salir() { await salir(); },
  go(d) { go(d.v); },
  async loginGoogle(d, el) {
    setBusy(el, true, 'Abriendo Google…');
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } }
    });
    if (error) { setBusy(el, false); toast(errMsg(error), true); }
  },
  refrescar() { boot(); },

  /* trabajador */
  pick(d) { S.w.sel = S.w.sel === d.v ? null : d.v; redraw(); },
  tipo(d) { S.w.tipo = d.v; S.w.sel = null; redraw(); },
  mes(d) { S.w.cal = { y: +d.y, m: +d.m }; S.w.sel = null; go('calendario'); },
  async pedir(d, el) {
    if (!S.w.sel) return;
    setBusy(el, true, 'Enviando…');
    const { error } = await sb.rpc('pedir_ausencia', { p_tipo: S.w.tipo, p_fecha: S.w.sel });
    if (error) { setBusy(el, false); toast(errMsg(error), true); return go('calendario'); }
    S.w.sel = null;
    toast('Pedido enviado. Acordate de escribirles por privado a los coordinadores.');
    go('calendario');
  },
  async cancelar(d, el) {
    if (!confirm('¿Cancelar este pedido? Los días vuelven a estar disponibles para todo el equipo.')) return;
    setBusy(el, true, 'Cancelando…');
    const { error } = await sb.rpc('cancelar_solicitud', { p_id: d.id });
    if (error) { setBusy(el, false); return toast(errMsg(error), true); }
    toast('Pedido cancelado.');
    go('pedidos');
  },
  grillaCat(d) { if (esAdmin()) S.a.grillaCat = d.v; else S.w.grillaCat = d.v; redraw(); },

  /* admin */
  solTab(d) { S.a.tab = d.v; go('solicitudes'); },
  async votar(d, el) {
    if (d.v === 'rechazado' && !confirm('¿Rechazar este pedido? Se libera el cupo y la persona recupera sus días.')) return;
    setBusy(el, true);
    const { data, error } = await sb.rpc('votar_solicitud', { p_id: d.id, p_voto: d.v });
    if (error) { setBusy(el, false); return toast(errMsg(error), true); }
    toast(data === 'aprobado' ? 'Pedido aprobado.' : data === 'rechazado' ? 'Pedido rechazado.' : 'Voto registrado. Faltan otras aprobaciones.');
    go('solicitudes');
  },
  async anular(d, el) {
    if (!confirm('¿Anular este pedido? Se libera el cupo y la persona recupera sus días.')) return;
    setBusy(el, true);
    const { error } = await sb.rpc('anular_solicitud', { p_id: d.id });
    if (error) { setBusy(el, false); return toast(errMsg(error), true); }
    toast('Pedido anulado.');
    go(S.view);
  },
  calMes(d) {
    const t = new Date(Date.UTC(S.a.cal.y, S.a.cal.m + Number(d.v), 1));
    S.a.cal = { y: t.getUTCFullYear(), m: t.getUTCMonth() }; S.a.dia = null; go('calendarioGeneral');
  },
  dia(d) { S.a.dia = S.a.dia === d.v ? null : d.v; redraw(); },
  async mesToggle(d) {
    const y = +d.y, m = +d.m;
    const { error } = await sb.from('meses_excepciones').upsert({ anio: y, mes: m + 1, abierto: !mesAbierto(y, m) });
    if (error) return toast(errMsg(error), true);
    go('meses');
  },
  async mesAuto(d) {
    const { error } = await sb.from('meses_excepciones').delete().eq('anio', +d.y).eq('mes', +d.m + 1);
    if (error) return toast(errMsg(error), true);
    go('meses');
  },
  async grillaBorrar(d, el) {
    if (!confirm('¿Borrar esta grilla? Deja de verse para todos.')) return;
    setBusy(el, true);
    const { error } = await sb.from('grillas').delete().eq('id', d.id);
    if (error) { setBusy(el, false); return toast(errMsg(error), true); }
    await sb.storage.from('grillas').remove([d.path]);
    toast('Grilla borrada.');
    go('grillasAdmin');
  },
  async rechazarAcceso(d, el) {
    if (!confirm('¿Rechazar esta solicitud? La persona no va a poder entrar. Si fue un error, después la podés habilitar desde Editar.')) return;
    setBusy(el, true);
    const { error } = await sb.from('personal').update({ activo: false, pendiente: false }).eq('id', d.id);
    if (error) { setBusy(el, false); return toast(errMsg(error), true); }
    toast('Solicitud rechazada.');
    go('personal');
  },
  pf(d) { S.a.pf = d.v; redraw(); },
  pregTab(d) { S.a.pregTab = d.v; go('preguntas'); },
  linkEdit(d) { S.a.linkEdit = Number(d.id); redraw(); },
  linkEditCancel() { S.a.linkEdit = null; redraw(); },
  async linkBorrar(d, el) {
    if (!confirm('¿Borrar este link? Deja de verse para todos.')) return;
    setBusy(el, true);
    const { error } = await sb.from('links').delete().eq('id', Number(d.id));
    if (error) { setBusy(el, false); return toast(errMsg(error), true); }
    toast('Link borrado.');
    go('linksAdmin');
  },
  async linkMover(d) {
    const id = Number(d.id), l = S.a.links.find(x => x.id === id);
    const grupo = S.a.links.filter(x => x.categoria === l.categoria);
    const i = grupo.indexOf(l), j = i + Number(d.v);
    if (j < 0 || j >= grupo.length) return;
    [grupo[i], grupo[j]] = [grupo[j], grupo[i]];
    const res = await Promise.all(grupo.map((x, k) => sb.from('links').update({ orden: k }).eq('id', x.id)));
    const err = res.find(r => r.error);
    if (err) return toast(errMsg(err.error), true);
    go('linksAdmin');
  },
  edit(d) { S.a.edit = d.id; redraw(); },
  editCancel() { S.a.edit = null; redraw(); },
  async ferQuitar(d) {
    if (!confirm('¿Quitar este feriado?')) return;
    const { error } = await sb.from('feriados').delete().eq('fecha', d.v);
    if (error) return toast(errMsg(error), true);
    toast('Feriado quitado.');
    go('configuracion');
  }
};

/* ================= Formularios ================= */
const FORMS = {
  async 'f-link'(f) {
    const titulo = f.titulo.value.trim(), url = f.url.value.trim(), descripcion = f.descripcion.value.trim() || null, categoria = f.categoria.value;
    if (!titulo) return toast('Poné un nombre para el link.', true);
    if (!urlSegura(url)) return toast('El link tiene que empezar con https:// (copialo entero desde el navegador).', true);
    const orden = (S.a.links || []).filter(x => x.categoria === categoria).length;
    const btn = f.querySelector('button[type=submit]');
    setBusy(btn, true, 'Agregando…');
    const { error } = await sb.from('links').insert({ titulo, url, descripcion, categoria, orden });
    if (error) { setBusy(btn, false); return toast(errMsg(error), true); }
    toast('Link agregado.');
    go('linksAdmin');
  },
  async 'f-link-editar'(f) {
    const titulo = f.titulo.value.trim(), url = f.url.value.trim(), descripcion = f.descripcion.value.trim() || null, categoria = f.categoria.value;
    if (!titulo) return toast('Poné un nombre para el link.', true);
    if (!urlSegura(url)) return toast('El link tiene que empezar con https:// (copialo entero desde el navegador).', true);
    const actual = S.a.links.find(x => x.id === Number(f.dataset.id));
    const cambios = { titulo, url, descripcion, categoria };
    if (actual && actual.categoria !== categoria) cambios.orden = S.a.links.filter(x => x.categoria === categoria).length;
    const { error } = await sb.from('links').update(cambios).eq('id', Number(f.dataset.id));
    if (error) return toast(errMsg(error), true);
    S.a.linkEdit = null;
    toast('Link guardado.');
    go('linksAdmin');
  },
  async 'f-pregunta'(f) {
    const texto = f.texto.value.trim();
    if (texto.length < 3) return toast('Escribí tu pregunta.', true);
    const btn = f.querySelector('button[type=submit]');
    setBusy(btn, true, 'Enviando…');
    const { error } = await sb.rpc('enviar_consulta', { p_texto: texto });
    if (error) { setBusy(btn, false); return toast(errMsg(error), true); }
    toast('Pregunta enviada. Te van a responder acá, en Ayuda.');
    go('ayuda');
  },
  async 'f-responder'(f) {
    const respuesta = f.respuesta.value.trim();
    if (!respuesta) return toast('Escribí la respuesta.', true);
    const btn = f.querySelector('button[type=submit]');
    setBusy(btn, true, 'Enviando…');
    const { error } = await sb.rpc('responder_consulta', { p_id: Number(f.dataset.id), p_respuesta: respuesta });
    if (error) { setBusy(btn, false); return toast(errMsg(error), true); }
    toast('Respuesta enviada.');
    go('preguntas');
  },
  async 'f-aprobar'(f) {
    const btn = f.querySelector('button[type=submit]');
    setBusy(btn, true, 'Aprobando…');
    const { error } = await sb.from('personal').update({ activo: true, pendiente: false, rol: f.rol.value, tipo_contratacion_id: f.tipo.value ? Number(f.tipo.value) : null }).eq('id', f.dataset.id);
    if (error) { setBusy(btn, false); return toast(errMsg(error), true); }
    toast('Acceso aprobado. Ya puede entrar.');
    go('personal');
  },
  async 'f-perfil'(f) {
    const btn = f.querySelector('button[type=submit]');
    setBusy(btn, true, 'Guardando…');
    const { error } = await sb.rpc('completar_perfil', { p_nombre: f.nombre.value, p_apellido: f.apellido.value, p_telefono: f.telefono.value });
    if (error) { setBusy(btn, false); return toast(errMsg(error), true); }
    boot();
  },
  async 'f-grilla'(f) {
    const file = f.archivo.files[0], titulo = f.titulo.value.trim(), cat = f.categoria.value;
    if (!titulo || !file) return toast('Completá el título y elegí una imagen.', true);
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return toast('La imagen tiene que ser JPG, PNG o WEBP.', true);
    if (file.size > 10 * 1024 * 1024) return toast('La imagen pesa más de 10 MB.', true);
    const btn = f.querySelector('button[type=submit]');
    setBusy(btn, true, 'Subiendo…');
    const ext = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' }[file.type];
    const path = cat + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const up = await sb.storage.from('grillas').upload(path, file, { contentType: file.type });
    if (up.error) { setBusy(btn, false); return toast(errMsg(up.error), true); }
    const { error } = await sb.from('grillas').insert({ titulo, categoria: cat, imagen_path: path, subido_por: S.me.id });
    if (error) { await sb.storage.from('grillas').remove([path]); setBusy(btn, false); return toast(errMsg(error), true); }
    S.a.grillaCat = cat;
    toast('Grilla subida.');
    go('grillasAdmin');
  },
  async 'f-persona'(f) {
    const email = f.email.value.trim().toLowerCase();
    if (!mailValido(email)) return toast('Revisá el mail.', true);
    const btn = f.querySelector('button[type=submit]');
    setBusy(btn, true, 'Habilitando…');
    const { error } = await sb.from('personal').insert({ email, rol: f.rol.value, tipo_contratacion_id: f.tipo.value ? Number(f.tipo.value) : null });
    setBusy(btn, false);
    if (error) return toast(error.code === '23505' ? 'Ese mail ya está cargado.' : errMsg(error), true);
    toast('Listo. ' + email + ' ya puede entrar con Google.');
    go('personal');
  },
  async 'f-editar'(f) {
    const id = f.dataset.id, rol = f.rol.value, activo = f.activo.checked;
    if (id === S.me.id && (rol === 'trabajador' || !activo) && !confirm('Te estás quitando el acceso de administrador. ¿Seguro?')) return;
    const { error } = await sb.from('personal').update({ rol, activo, tipo_contratacion_id: f.tipo.value ? Number(f.tipo.value) : null }).eq('id', id);
    if (error) return toast(errMsg(error), true);
    S.a.edit = null;
    toast('Cambios guardados.');
    if (id === S.me.id) return boot();
    go('personal');
  },
  async 'f-config'(f) {
    const cupo = Number(f.cupo.value), meses = Number(f.meses.value), aprobacion = f.aprobacion.value;
    if (!(cupo >= 1 && cupo <= 20) || !(meses >= 1 && meses <= 12)) return toast('Revisá los números: cupo entre 1 y 20, meses entre 1 y 12.', true);
    const { error } = await sb.from('configuracion').update({ cupo_diario: cupo, meses_habilitados: meses, aprobacion, updated_at: new Date().toISOString() }).eq('id', true);
    if (error) return toast(errMsg(error), true);
    toast('Reglas guardadas.');
    go('configuracion');
  },
  async 'f-tipo'(f) {
    const { error } = await sb.from('tipos_contratacion').update({ nombre: f.nombre.value.trim(), semanas_vacaciones: Number(f.semanas.value), aca_anuales: Number(f.aca.value) }).eq('id', Number(f.dataset.id));
    if (error) return toast(error.code === '23505' ? 'Ya hay un tipo con ese nombre.' : errMsg(error), true);
    toast('Tipo guardado.');
    go('configuracion');
  },
  async 'f-tipo-nuevo'(f) {
    const { error } = await sb.from('tipos_contratacion').insert({ nombre: f.nombre.value.trim() });
    if (error) return toast(error.code === '23505' ? 'Ya hay un tipo con ese nombre.' : errMsg(error), true);
    toast('Tipo agregado.');
    go('configuracion');
  },
  async 'f-feriado'(f) {
    const { error } = await sb.from('feriados').insert({ fecha: f.fecha.value, nombre: f.nombre.value.trim() });
    if (error) return toast(error.code === '23505' ? 'Ese día ya está cargado como feriado.' : errMsg(error), true);
    toast('Feriado agregado.');
    go('configuracion');
  }
};

/* ================= Eventos ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  const fn = FORMS[f.id] || (f.classList.contains('f-tipo') ? FORMS['f-tipo'] : f.classList.contains('f-aprobar') ? FORMS['f-aprobar'] : f.classList.contains('f-responder') ? FORMS['f-responder'] : f.classList.contains('f-link-editar') ? FORMS['f-link-editar'] : null);
  if (fn) { e.preventDefault(); fn(f); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.input === 'buscar') {
    S.a.q = e.target.value;
    const pos = e.target.selectionStart;
    redraw();
    const inp = document.getElementById('buscar');
    if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (_) {} }
  }
});
sb.auth.onAuthStateChange(event => {
  if (event === 'SIGNED_OUT') { S.me = null; setTimeout(renderLogin, 0); }
  if (event === 'SIGNED_IN' && !S.me) setTimeout(boot, 0);
});
// Si Google devolvió un error (por ejemplo, la persona canceló), avisarlo y limpiar la dirección
(function () {
  const p = new URLSearchParams(location.hash.slice(1) + '&' + location.search.slice(1));
  const err = p.get('error_description') || p.get('error');
  if (err) {
    history.replaceState(null, '', location.pathname);
    setTimeout(() => toast(/access_denied|cancel/i.test(err) ? 'Se canceló el ingreso con Google.' : 'No se pudo entrar: ' + err.replace(/\+/g, ' '), true), 300);
  }
})();
boot();
</script>
